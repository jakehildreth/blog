<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <style>
    :root {
      --black: #000000;
      --green: #00ff41;
      --dark-green: #003b00;
    }

    body {
      background: var(--black);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .glitch {
      font-family: 'Courier New', Courier, monospace;
      font-size: 4rem;
      font-weight: bold;
      color: var(--green);
      text-shadow:
        0 0 5px var(--green),
        0 0 10px var(--green),
        0 0 20px var(--dark-green);
      position: relative;
      animation: glitch 2.5s infinite;
    }

    .glitch::before,
    .glitch::after {
      content: 'Hello World';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .glitch::before {
      color: #00ffff;
      animation: glitch-top 2.5s infinite;
      clip-path: polygon(0 0, 100% 0, 100% 40%, 0 40%);
      transform: translate(-2px, -2px);
    }

    .glitch::after {
      color: #ff00ff;
      animation: glitch-bottom 2.5s infinite;
      clip-path: polygon(0 60%, 100% 60%, 100% 100%, 0 100%);
      transform: translate(2px, 2px);
    }

    @keyframes glitch {
      0%, 90%, 100% { transform: translate(0); }
      91% { transform: translate(-2px, 1px); }
      93% { transform: translate(2px, -1px); }
      95% { transform: translate(-1px, 2px); }
      97% { transform: translate(1px, -2px); }
    }

    @keyframes glitch-top {
      0%, 90%, 100% { transform: translate(0); opacity: 1; }
      91% { transform: translate(-4px, 0); opacity: 0.8; }
      93% { transform: translate(4px, 0); opacity: 0.8; }
      95% { transform: translate(-2px, 0); opacity: 0; }
      97% { transform: translate(2px, 0); opacity: 0.8; }
    }

    @keyframes glitch-bottom {
      0%, 90%, 100% { transform: translate(0); opacity: 1; }
      91% { transform: translate(4px, 0); opacity: 0.8; }
      93% { transform: translate(-4px, 0); opacity: 0.8; }
      95% { transform: translate(2px, 0); opacity: 0; }
      97% { transform: translate(-2px, 0); opacity: 0.8; }
    }
  </style>
</head>
<body>
  <span class="glitch">Hello World</span>
</body>
</html>
