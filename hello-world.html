<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>

      --black: #000000;
      --pink: #ff007f;
      --darker-cyan: #007f7f;

    body {
      background: var(--black);
      text-shadow: -2px 0px 2px var(--pink), 2px 0px 2px var(--darker-cyan);

      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;

      font-size: 3rem;
    }

</head>
<body>

</body>
</html>
